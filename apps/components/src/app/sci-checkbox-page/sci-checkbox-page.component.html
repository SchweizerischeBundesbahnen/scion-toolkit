<main>
  <sci-checkbox [formControl]="form.controls.checkbox"></sci-checkbox>
</main>

<aside [formGroup]="form">
  <sci-tabbar>
    <ng-template sciTab label="State">
      <div class="tab">
        <label>
          <input [formControl]="form.controls.state.controls.disabled" type="checkbox">
          Disabled
        </label>
      </div>
    </ng-template>
  </sci-tabbar>
</aside>
