<main>
  <sci-filter-field placeholder="Enter a filter text" [formControl]="form.controls.filterField"></sci-filter-field>
  @if (filterText()) {
    <output>{{filterText()}}</output>
  }
</main>

<aside [formGroup]="form">
  <sci-tabbar>
    <ng-template sciTab label="State">
      <div class="tab">
        <label>
          <input [formControl]="form.controls.state.controls.disabled" type="checkbox">
          Disabled
        </label>
      </div>
    </ng-template>
  </sci-tabbar>
</aside>
