@if (tree(); as tree) {
  <main>
    <sci-tree [tree]="tree" name="tree:files"/>
    <sci-filter-field (filter)="onTreeFilter($event)" placeholder="Type to filter"/>
  </main>

  <aside [class.closed]="!panelOpen()">
    <sci-tabbar>
      <!-- Settings -->
      <ng-template sciTab label="Settings" name="settings">
        <section>
          <label>
            Selectable
            <select [ngModel]="selectable()" (ngModelChange)="updateSelectable($event)">
              <option value="multi">Multi</option>
              <option value="single">Single</option>
              <option value="false">False</option>
            </select>
          </label>

          <button type="button" (click)="onUserSettingsReset()" class="reset">Reset User Settings</button>
        </section>
      </ng-template>

      <!-- Design Tokens -->
      <ng-template sciTab label="Design Tokens">
        <section class="design-tokens">
          <app-design-token-form [form]="designTokenForm" [designTokenRootElement]="host"/>
        </section>
      </ng-template>

      <!-- Methods -->
      <ng-template sciTab label="Methods">
        <form>
          <section class="methods">
            <label>
              <input [formField]="methodsForm.selectId"/>
            </label>
            <button type="button" (click)="onSelect()">Select</button>
          </section>

          <button type="button" (click)="onExpandAll()">Expand All</button>
          <button type="button" (click)="onCollapseAll()">Collapse All</button>
        </form>
      </ng-template>

      <!-- Datasource -->
      <ng-template sciTab label="Datasource">
        <section>
          <label>
            <input [formField]="settingsForm.slowDatasource" type="checkbox"/>
            Slow Datasource
          </label>
        </section>
      </ng-template>
    </sci-tabbar>
  </aside>
}
