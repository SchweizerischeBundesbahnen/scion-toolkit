@if (tree(); as tree) {
  <main>
    <sci-tree [tree]="tree" name="tree:files"/>
    <sci-filter-field (filter)="onTreeFilter($event)" placeholder="Type to filter"/>
  </main>

  <aside [class.closed]="!panelOpen()">
    <sci-tabbar>
      <!-- Settings -->
      <ng-template sciTab label="Settings" name="settings">
        <section>
          <label>
            Selectable
            <select [ngModel]="selectable()" (ngModelChange)="updateSelectable($event)">
              <option value="multi">Multi</option>
              <option value="single">Single</option>
              <option value="false">False</option>
            </select>
          </label>
        </section>
      </ng-template>

      <!-- Design Tokens -->
      <ng-template sciTab label="Design Tokens">
        <section class="design-tokens">
          <app-design-token-form [form]="designTokenForm" [designTokenRootElement]="host"/>
        </section>
      </ng-template>

      <!-- Datasource -->
      <ng-template sciTab label="Datasource">
        <section>
          <label>
            <input [formField]="settingsForm.slowDatasource" type="checkbox"/>
            Slow Datasource
          </label>
        </section>
      </ng-template>
    </sci-tabbar>
  </aside>
}

<dialog #fileRenameDialog>
  <form [formRoot]="renameFileForm" class="file">
    <label>
      Name
      <input [formField]="renameFileForm.name" appFieldValidation/>
    </label>

    <div class="button-bar">
      <button type="submit" [disabled]="renameFileForm().invalid()">Rename</button>
      <button type="button" (click)="onFileRenameCancel()">Cancel</button>
    </div>
  </form>
</dialog>

<dialog #newFileDialog>
  <form [formRoot]="newFileForm" class="file">
    <span>New {{newFileForm.type().value() === 'file' ? 'File' : 'Folder'}}</span>

    <label>
      <input [formField]="newFileForm.name" appFieldValidation/>
    </label>

    <div class="button-bar">
      <button type="submit" [disabled]="newFileForm().invalid()">Create</button>
      <button type="button" (click)="onNewFileCancel()">Cancel</button>
    </div>
  </form>
</dialog>
