@if (tree(); as tree) {
  <main>
    <sci-tree [tree]="tree" name="tree:companies"/>
  </main>

  <aside>
    <sci-tabbar>
      <!-- Settings -->
      <ng-template sciTab label="Settings" name="settings">
        <section>
          <sci-form-field label="Header">
            <input [formField]="settingsForm.header"/>
          </sci-form-field>

          <sci-form-field label="Filterable">
            <input [(ngModel)]="tree.filterable" type="checkbox"/>
          </sci-form-field>

          <sci-form-field label="Sortable">
            <input [(ngModel)]="tree.sortable" type="checkbox"/>
          </sci-form-field>

          <sci-form-field label="Wrap Header">
            <input [(ngModel)]="tree.wrapHeader" type="checkbox"/>
          </sci-form-field>

          <sci-form-field label="Selectable">
            <select [ngModel]="selectable()" (ngModelChange)="updateSelectable($event)">
              <option value="multi">Multi</option>
              <option value="single">Single</option>
              <option value="false">False</option>
            </select>
          </sci-form-field>

          <button type="button" (click)="onUserSettingsReset()">Reset User Settings</button>
        </section>
      </ng-template>

      <!-- Data Source -->
      <ng-template sciTab label="Datasource">
        <section>
          <sci-form-field label="Row Count">
            <input [(ngModel)]="rowCount" appMinMax min="0" max="100000" type="number"/>
          </sci-form-field>

          <sci-form-field label="Slow Datasource">
            <input [formField]="settingsForm.slowDataSource" type="checkbox"/>
          </sci-form-field>
        </section>
      </ng-template>
    </sci-tabbar>

    <section class="tree-state">
      <header #header>Tree State</header>

      <sci-form-field label="Active Id" [style.max-width.px]="header.clientWidth">
        {{tree.activeItem()?.dataId ?? '-'}}
      </sci-form-field>

      <sci-form-field label="Selection Count">
        {{tree.selectedItems().length}}
      </sci-form-field>

      <sci-form-field label="Selection" [style.max-width.px]="header.clientWidth"> <!-- Prevent viewport from grabbing available space. -->
        <sci-viewport>
          {{selection()}}
        </sci-viewport>
      </sci-form-field>
    </section>
  </aside>
}
