<main>
  <div class="table-header">
    <sci-filter-field [(ngModel)]="filter" (ngModelChange)="table.filter($event)"></sci-filter-field>
  </div>
  <sci-table name="table:companies-alt" [table]="table" />
</main>

<aside class="e2e-settings">
  <form>
    <label>
      <input [(ngModel)]="table.filterable" type="checkbox" />
      Filterable
    </label>

    <label>
      <input [(ngModel)]="table.sortable" type="checkbox" />
      Sortable
    </label>

    <label>
      <input [(ngModel)]="table.resizable" type="checkbox" />
      Resizable
    </label>

    <label>
      <input [(ngModel)]="table.showHeader" type="checkbox" />
      Show Header
    </label>

    <label>
      Selection
      <select [ngModel]="selectable()" (ngModelChange)="updateSelectable($event)">
        <option value="multi">Multi</option>
        <option value="single">Single</option>
        <option value="false">Disabled</option>
      </select>
    </label>
  </form>
</aside>
