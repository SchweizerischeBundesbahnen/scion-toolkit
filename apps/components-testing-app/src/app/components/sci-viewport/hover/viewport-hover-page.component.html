<sci-viewport [class.horizontal]="horizontalOverflow()" [class.vertical]="verticalOverflow()">
  <div class="content"></div>
</sci-viewport>

<fieldset>
  <label>
    <input type="checkbox" [(ngModel)]="verticalOverflow" class="e2e-vertical-overflow"/>
    Vertical Overflow
  </label>

  <label>
    <input type="checkbox" [(ngModel)]="horizontalOverflow" class="e2e-horizontal-overflow"/>
    Horizontal Overflow
  </label>
</fieldset>
