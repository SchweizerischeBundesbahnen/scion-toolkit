<main>
  @for (table of tables(); track $index) {
    <sci-table [table]="table"/>
  }
</main>

<aside class="e2e-properties">
  <sci-tabbar>
    <!-- Columns -->
    <ng-template sciTab label="Columns" cssClass="e2e-columns">
      <div class="columns">
        <form [formRoot]="columnForm" class="add-column" autocomplete="off">
          <sci-form-field label="Name">
            <input [formField]="$any(columnForm.name)" class="e2e-column-name" placeholder="column:<string>" appFieldValidation>
          </sci-form-field>

          <sci-form-field label="Header">
            <input [formField]="columnForm.header" class="e2e-column-header" appFieldValidation>
          </sci-form-field>

          <sci-form-field label="Column Type">
            <select [formField]="columnForm.type" class="e2e-column-type" appFieldValidation>
              <option value="string">String</option>
              <option value="number">Number</option>
              <option value="boolean">Boolean</option>
              <option value="template">Template</option>
              <option value="component">Component</option>
            </select>
          </sci-form-field>

          <sci-form-field label="Resizable">
            <input [formField]="columnForm.resizable" type="checkbox" class="e2e-resizable"/>
          </sci-form-field>

          <sci-form-field label="Custom Sort">
            <input [formField]="columnForm.customSort" type="checkbox" class="e2e-column-custom-sort">
          </sci-form-field>

          <sci-form-field label="Custom Filter">
            <input [formField]="columnForm.customFilter" type="checkbox" class="e2e-column-custom-filter">
          </sci-form-field>

          <sci-form-field label="Width">
            <input [formField]="columnForm.width" class="e2e-column-width">
          </sci-form-field>

          <sci-form-field label="Min Width">
            <input [formField]="columnForm.minWidth" type="number" class="e2e-column-min-width">
          </sci-form-field>

          <sci-form-field label="Max Width">
            <input [formField]="columnForm.maxWidth" type="number" class="e2e-column-max-width">
          </sci-form-field>

          <button class="e2e-column-add" type="submit" [disabled]="columnForm().invalid()">Add</button>
        </form>

        <!-- Visible Columns -->
        @if (columns().length) {
          <section>
            <header>Visible Columns</header>

            @for (column of columns(); track column.name) {
              <sci-form-field [label]="column.name">
                <input [(ngModel)]="column.visible" type="checkbox" [attr.data-column]="column.name" class="e2e-column-visibility"/>
              </sci-form-field>
            }
          </section>
        }
      </div>
    </ng-template>

    <!-- Settings -->
    <ng-template sciTab label="Settings" cssClass="e2e-settings">
      <form>
        <sci-form-field label="Filterable">
          <input [formField]="settingsForm.filterable" type="checkbox" class="e2e-filterable"/>
        </sci-form-field>

        <sci-form-field label="Sortable">
          <input [formField]="settingsForm.sortable" type="checkbox" class="e2e-sortable"/>
        </sci-form-field>

        <sci-form-field label="Resizable">
          <input [formField]="settingsForm.resizable" type="checkbox" class="e2e-resizable"/>
        </sci-form-field>

        <sci-form-field label="Selectable">
          <select [formField]="settingsForm.selectable" class="e2e-selectable">
            <option value="multi">Multi</option>
            <option value="single">Single</option>
            <option value="false">False</option>
          </select>
        </sci-form-field>

        <sci-form-field label="Show Header">
          <input [formField]="settingsForm.showHeader" type="checkbox" class="e2e-show-header"/>
        </sci-form-field>

        <sci-form-field label="Show Gridlines">
          <input [formField]="settingsForm.showGridlines" type="checkbox" class="e2e-show-gridlines"/>
        </sci-form-field>

        <sci-form-field label="Row Action">
          <input [formField]="settingsForm.showRowAction" type="checkbox" class="e2e-row-actions"/>
        </sci-form-field>

        <sci-form-field label="Custom Row Styling">
          <input [formField]="settingsForm.customRowStyling" type="checkbox" class="e2e-custom-row-styling">
        </sci-form-field>

        <sci-form-field label="Table Count">
          <input [formField]="settingsForm.tableCount" type="number" class="e2e-table-count"/>
        </sci-form-field>

        <sci-form-field label="Row Height">
          <input [formField]="settingsForm.rowHeight" type="number" class="e2e-row-height"/>
        </sci-form-field>

        <sci-form-field label="Table Width">
          <input [formField]="settingsForm.width" type="number" class="e2e-width"/>
        </sci-form-field>

        <sci-form-field label="Table Height">
          <input [formField]="settingsForm.height" type="number" class="e2e-height"/>
        </sci-form-field>
      </form>
    </ng-template>

    <!-- Date Source -->
    <ng-template sciTab label="Datasource" cssClass="e2e-datasource">
      <section>

        <sci-form-field label="Datasource">
          <select [formField]="settingsForm.datasource" class="e2e-datasource">
            <option value="array">Array</option>
            <option value="loader">Loader</option>
            <option value="loader-delayed">Loader (Delayed)</option>
            <option value="loader-http">Loader (HTTP)</option>
          </select>
        </sci-form-field>

        @if (settingsForm.datasource().value() !== 'loader-http') {
          <sci-form-field label="Row Count">
            <input [(ngModel)]="rowCount" type="number" class="e2e-row-count"/>
          </sci-form-field>
        }

        <sci-form-field label="Buffer Size">
          <input [formField]="settingsForm.bufferSize" type="number" class="e2e-buffer-size"/>
        </sci-form-field>
      </section>
    </ng-template>
  </sci-tabbar>

  <section class="table-state e2e-table-state">
    <header>Table State</header>

    <sci-form-field label="Selection Count">
      <output class="e2e-selection-count">{{selectedItems()?.length}}</output>
    </sci-form-field>
  </section>
</aside>

<ng-template let-product #cell>
  <sci-icon class="custom-cell" [class.up]="product.price > 500" [class.down]="product.price <= 500">
    {{product.price > 500 ? 'trending_up' : 'trending_down'}}
  </sci-icon>
</ng-template>
