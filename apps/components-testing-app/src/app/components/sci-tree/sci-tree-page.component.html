<main>
  @for (tree of trees(); track $index) {
    <sci-tree [name]="`tree:${$index}`" [tree]="tree"/>
  }
</main>

<aside>
  <sci-tabbar>
    <!-- Settings -->
    <ng-template sciTab label="Settings">
      <form>
        <label>
          <input [formField]="settingsForm.filterable" type="checkbox"/>
          Filterable
        </label>

        <label>
          <input [formField]="settingsForm.showNodeActions" type="checkbox"/>
          Show Node Actions
        </label>

        <label>
          <input [formField]="settingsForm.customRowStyling" type="checkbox">
          Custom Row Styling
        </label>

        <label>
          Selectable
          <select [formField]="settingsForm.selectable">
            <option value="multi">Multi</option>
            <option value="single">Single</option>
            <option value="false">False</option>
          </select>
        </label>

        <label>
          Tree Count
          <input [formField]="settingsForm.treeCount" type="number"/>
        </label>

        <label>
          Node Height
          <input [formField]="settingsForm.nodeHeight" type="number"/>
        </label>
      </form>
    </ng-template>

    <!-- Methods -->
    <ng-template sciTab label="Methods" cssClass="e2e-methods">
      <form>
        <section class="methods">
          <label>
            <input [formField]="methodsForm.selectId"/>
          </label>
          <button type="button" (click)="onSelect()">Select</button>
        </section>

        <button type="button" (click)="onExpandAll()">Expand All</button>
        <button type="button" (click)="onCollapseAll()">Collapse All</button>
      </form>
    </ng-template>

    <!-- Data Source -->
    <ng-template sciTab label="Datasource" cssClass="e2e-datasource">
      <section>
        <label>
          Datasource
          <select [formField]="datasourceForm.datasource">
            <option value="array">Array</option>
            <option value="array-http">Array (HTTP)</option>
            <option value="loader">Loader</option>
            <option value="loader-delayed">Loader (Delayed)</option>
            <option value="loader-http">Loader (HTTP)</option>
          </select>
        </label>

        <!-- Change of row count is only supported for non-HTTP datasources. -->
        @switch (datasourceForm.datasource().value()) {
          @case ('array')
          @case ('loader')
          @case ('loader-delayed') {
            <label>
              Row Count
              <input [(ngModel)]="rowCount" type="number"/>
            </label>
          }
        }

        <label>
          Buffer Size
          <input [formField]="datasourceForm.bufferSize" type="number"/>
        </label>

        <label>
          Page Size
          <input [formField]="datasourceForm.pageSize" type="number"/>
        </label>

        @switch (datasourceForm.datasource().value()) {
          @case ('loader')
          @case ('loader-delayed')
          @case ('loader-http') {
            <label>
              <input [formField]="datasourceForm.simulateError" type="checkbox"/>
              Simulate Error
            </label>
          }
        }
      </section>
    </ng-template>

    <!-- Layout -->
    <ng-template sciTab label="Layout" cssClass="e2e-layout">
      <form>
        <label>
          Height
          <input [formField]="layoutForm.treeHeight" type="number"/>
        </label>

        <label>
          Width
          <input [formField]="layoutForm.treeWidth" type="number"/>
        </label>

        <label>
          Max Height
          <input [formField]="layoutForm.treeMaxHeight" type="number"/>
        </label>

        <label>
          Page Height
          <input [formField]="layoutForm.pageHeight" type="number"/>
        </label>

        <label>
          <input [formField]="layoutForm.treeGrowToBreakpoint" type="checkbox"/>
          Grow To Breakpoint
        </label>
      </form>
    </ng-template>
  </sci-tabbar>

  <section class="tree-state e2e-tree-state">
    <header>Tree State</header>

    <label>
      Active Id:
      <output>{{activeItemId() ?? '-'}}</output>
    </label>

    <label>
      Selection Count:
      <output>{{selectedItems()?.length}}</output>
    </label>

    <label>
      Selection:
      <sci-viewport>
        <output>{{selection()}}</output>
      </sci-viewport>
    </label>
  </section>
</aside>

<ng-template let-product #custom_column_template>
  <app-custom-column [product]="product"/>
</ng-template>
