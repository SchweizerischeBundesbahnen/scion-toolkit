@let cell = this.cell();


@if (index() === 0 && (row().hasChildren | async)) {
  <button class="toggle-children" (click)="toggleChildren()">
    @if (isExpanded()) {
      <sci-icon>scion.chevron_down</sci-icon>
    } @else {
      <sci-icon>scion.chevron_right</sci-icon>
    }
  </button>
}

@switch (cell.type) {
  @case ('template') {
    <ng-template *ngTemplateOutlet="template(); context: templateContext()"/>
  }
  @case ('component') {
    <ng-container *sciComponentOutlet="cell.component"/>
  }
  @case ('boolean') {
    <!-- TODO [dwie] Use another ligature for icon scion.clear -->
    <sci-icon class="checkbox">{{cell.value() ? 'scion.checkmark' : 'scion.clear'}}</sci-icon>
  }
  @default {
    {{cell.value()}}
  }
}
