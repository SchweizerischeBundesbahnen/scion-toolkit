<!-- Render splitters, even for non-resizable columns, as non-interactive column header dividers. -->
@for (column of table().columns(); track column.name; let i = $index) {
  <sci-splitter orientation="vertical"
                [class.resizing]="column.resizing()"
                [attr.data-column]="column.name"
                [attr.data-non-resizable]="!column.resizable() ? '' : null"
                [style.grid-column]="i + 1"
                (start)="onResizeStart(column)"
                (move)="onResize(column, $event)"
                (end)="onResizeEnd()"
                (reset)="onPack(column)"
                (mouseenter)="onMouseEnter()"
                (mouseleave)="onMouseLeave()"/>
}

<!-- Render an invisible synthetic column per column to read current widths and set minimum widths. -->
@for (column of table().columns(); track column.name; let i = $index) {
  <sci-table-column [column]="column" [style.grid-column]="i + 1"/>
}
