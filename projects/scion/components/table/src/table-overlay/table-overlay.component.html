@for (column of table().columns(); track column.name) {
  @if (column.resizable()) {
    <sci-splitter [class.resizing]="resizingColumn()?.name === column.name" orientation="vertical"
                  (start)="onResizeStart(column)"
                  (move)="onResize($event)"
                  (end)="onResizeEnd()"
                  (reset)="onResizeAuto(column)"
                  (mouseleave)="onMouseLeave()"
    />
  }
}
