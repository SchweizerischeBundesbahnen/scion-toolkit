@let row = this.row();

<!-- Handle to expand or collapse a tree node -->
@if (row.level !== undefined) {
  <button class="tree-node-handle e2e-tree-node-handle" (click)="onTreeNodeHandle($event)" [attr.disabled]="!row.hasChildren() || null">
    @if (row.expanded()) {
      <sci-icon class="e2e-expanded">scion:chevron_down</sci-icon>
    } @else {
      <sci-icon class="e2e-collapsed">scion:chevron_right</sci-icon>
    }
  </button>
}

<!-- Row Icons -->
@if (row.cells.length) {
  @for (icon of row.bindings.icons(); track $index) {
    <sci-icon>{{icon}}</sci-icon>
  }
}

<!-- Table Cells -->
@for (cell of row.cells; track cell.column.name) {
  <sci-table-cell [cell]="cell" [row]="row"/>
} @empty {
  @for (column of table().columns(); track column.name) {
    <div class="skeleton e2e-skeleton" [attr.data-column]="column.name"></div>
  }
}
