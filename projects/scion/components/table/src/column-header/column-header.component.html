@if (column().sortable()) {
  <button class="sort e2e-sort"
          [attr.data-sort-direction]="sortDirection()"
          (click)="onSort($event)">
    <!-- Header -->
    <ng-container *ngTemplateOutlet="header_template"/>

    <!-- Sort Indicator -->
    @switch (sortDirection()) {
      @case ('asc') {
        <sci-icon>scion.sort_ascending</sci-icon>
      }
      @case ('desc') {
        <sci-icon>scion.sort_descending</sci-icon>
      }
      @default {
        <sci-icon class="no-sort">scion.sort_indicator</sci-icon>
      }
    }
  </button>
} @else {
  <ng-container *ngTemplateOutlet="header_template"/>
}

<ng-template #header_template>
  @if (column().header.icon) {
    <sci-icon class="label e2e-label">{{column().header.icon}}</sci-icon>
  }

  @if (column().header.label) {
    <span [class.wrap]="table().wrapHeader()" class="label" #label>
      {{column().header.label!()}}
    </span>
  }
</ng-template>
