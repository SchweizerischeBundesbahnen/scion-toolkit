@if (table().showHeader()) {
  @let label = (column().label() | sciText)();
  @if (column().sortable()) {
    <button class="column-header column-sort e2e-column-sort"
            [attr.data-sort]="columnSort()"
            [title]="label"
            (click)="onSort($event)">
      <span class="label e2e-label" [class.wrap-header]="table().wrapHeader()">{{label}}</span>
      @switch (columnSort()) {
        @case ('asc') {
          <sci-icon>scion.chevron_up</sci-icon>
        }
        @case ('desc') {
          <sci-icon>scion.chevron_down</sci-icon>
        }
        @default {
          <span class="sort">
            <sci-icon>scion.chevron_up</sci-icon>
            <sci-icon>scion.chevron_down</sci-icon>
          </span>
        }
      }
    </button>
  } @else {
    <div class="column-header" [title]="label">
      <span class="label e2e-label" [class.wrap-header]="table().wrapHeader()">{{label}}</span>
    </div>
  }
}

@if (column().filterable()) {
  <sci-column-filter [column]="column()"/>
} @else if (table().filterable()) {
  <div></div>
}
