@if (column().filterable()) {
  @let active = filter() !== null && filter() !== '';

  <sci-icon class="filter e2e-filter" [class.active]="active" (click)="onFilterClick()">scion.filter</sci-icon>

  @switch (column().type) {
    @case ('number') {
      <input [(ngModel)]="filter" type="number" #input/>
    }
    @case ('boolean') {
      <select [(ngModel)]="filter" #input>
        <option [value]="''">All</option>
        <option [value]="true">True</option>
        <option [value]="false">False</option>
      </select>
    }
    @default {
      <input [(ngModel)]="filter" type="text" #input/>
    }
  }
  @if (active && column().type !== 'boolean') {
    <button class="clear e2e-clear" (click)="onReset()">
      <sci-icon>scion.clear</sci-icon>
    </button>
  }
}
