@let empty = filter() === null || filter() === '';

<sci-icon class="filter-icon" [class.active]="!empty">scion.filter</sci-icon>

@switch (column().type) {
  @case ('number') {
    <input [(ngModel)]="filter" type="number" />
  }
  @case ('boolean') {
    <select [(ngModel)]="filter">
      <option [value]="''">All</option>
      <option [value]="true">True</option>
      <option [value]="false">False</option>
    </select>
  }
  @default {
    <input [(ngModel)]="filter" type="text" />
  }
}
@if (!empty && column().type !== 'boolean') {
  <button class="clear e2e-clear" (click)="reset()">
    <sci-icon>scion.clear</sci-icon>
  </button>
}
