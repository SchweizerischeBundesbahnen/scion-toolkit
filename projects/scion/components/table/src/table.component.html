@let table = this.table();

<div class="viewport e2e-viewport" #viewport sciTableViewportRef>
  <sci-table-grid>
    <!-- Table header -->
    @if (table.filterable() || table.headerVisible()) {
      <sci-table-header>
        @for (column of table.columns(); track column.name) {
          <sci-column-header [column]="column"/>
        }
      </sci-table-header>
    }

    <!-- Table body -->
    <sci-table-body sciTableKeyboardNavigator tabindex="0">
      <!-- Track index to reuse the table row elements -->
      @for (row of table.rows(); track $index) {
        <sci-table-row [row]="row" (primaryAction)="onRowPrimaryAction(row.item!)" [sciAttributes]="row.bindings?.attributes()"/>
      } @empty {
        <span class="empty">{{('%scion.components.no_items.message' | sciText)()}}</span>
      }
    </sci-table-body>

    <!-- Column splitters -->
    <sci-column-splitters [rows]="rows()"/>

    <!-- Column Bounds -->
    <sci-column-bounds/>
  </sci-table-grid>
</div>

<!--Scrollbars-->
<sci-scrollbar direction="hscroll" [viewport]="viewport"/>
<sci-scrollbar direction="vscroll" [viewport]="viewport"/>

@if (table.loading()) {
  <sci-throbber type="spinner"/>
}

<div class="item-size" #item_size_element></div>
