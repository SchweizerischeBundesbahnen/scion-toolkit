<div class="scrolltrack-start"></div>

<!-- scrollthumb -->
<div #thumb_handle
     class="thumb-handle"
     [class.vertical]="vertical()"
     [class.horizontal]="horizontal()"
     (mousedown)="onThumbMouseDown($event)">
  <div class="thumb e2e-thumb"
       [class.vertical]="vertical()"
       [class.horizontal]="horizontal()">
  </div>
</div>

<div class="scrolltrack-end"></div>
