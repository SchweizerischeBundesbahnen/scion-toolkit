<!-- viewport and viewport client -->
<div #viewport
     class="viewport"
     tabindex="-1"
     sciScrollable [sciScrollableDisplayNativeScrollbar]="scrollbarStyle() === 'native'" #sciScrollable="sciScrollable"
     cdkScrollable>
  <div #viewport_client class="viewport-client" part="content">
    <slot></slot>
  </div>
</div>

<!-- render emulated scrollbars which sit on-top -->
@if (scrollbarStyle() === 'on-top' && sciScrollable.isNativeScrollbarCropped()) {
  <sci-scrollbar direction="vscroll" [viewport]="viewport"/>
  <sci-scrollbar direction="hscroll" [viewport]="viewport"/>
}
