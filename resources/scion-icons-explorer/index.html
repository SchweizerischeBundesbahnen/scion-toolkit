  <head>

    <title>SCION Icon Explorer</title>
    <style>
      :root {
        --bg-color: #f8fafc;
        --card-bg: #ffffff;
        --border-color: #e2e8f0;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --accent-bg: #eff6ff;
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        --radius: 12px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        padding: 2rem;
        min-height: 100vh;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
      }

      header {
        margin-bottom: 1.5rem;
        background: var(--card-bg);
        padding: 1.5rem 2rem;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        border: 1px solid var(--border-color);
      }

      .header-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.5rem;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text-main);
      }

      .json-url-display {
        font-size: 0.85rem;
        color: var(--text-muted);
        word-break: break-all;
      }

      .json-url-display a {
        color: var(--primary);
        text-decoration: none;
      }

      .json-url-display a:hover {
        text-decoration: underline;
      }

      /* Collapsible Details Styling */
      details.file-settings {
        margin-top: 1rem;
        border-top: 1px solid var(--border-color);
        padding-top: 1rem;
      }

      details.file-settings summary {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--text-muted);
        cursor: pointer;
        user-select: none;
        outline: none;
        transition: color 0.2s;
      }

      details.file-settings summary:hover {
        color: var(--primary);
      }

      .controls-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.25rem;
        margin-top: 1rem;
      }

      @media (max-width: 768px) {
        .controls-grid {
          grid-template-columns: 1fr;
        }
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .input-group label {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .url-input-wrapper {
        display: flex;
        gap: 0.5rem;
      }

      input[type="text"] {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 0.95rem;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      input[type="text"]:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      }

      .btn {
        padding: 0.75rem 1.25rem;
        background-color: var(--primary);
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        transition: background-color 0.2s;
      }

      .btn:hover {
        background-color: var(--primary-hover);
      }

      .file-label {
        display: inline-block;
        padding: 0.75rem 1rem;
        background: var(--bg-color);
        border: 1px dashed var(--border-color);
        border-radius: 8px;
        cursor: pointer;
        width: 100%;
        text-align: center;
        color: var(--text-muted);
        font-size: 0.95rem;
        transition: border-color 0.2s, background-color 0.2s;
      }

      .file-label:hover {
        border-color: var(--primary);
        background-color: var(--accent-bg);
        color: var(--primary);
      }

      input[type="file"] {
        display: none;
      }

      /* Search Section */
      .search-section {
        background: var(--card-bg);
        padding: 1.25rem 2rem;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        border: 1px solid var(--border-color);
        margin-bottom: 1.5rem;
      }

      .search-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        width: 100%;
      }

      .search-input {
        font-size: 1.05rem !important;
        padding-right: 2.75rem !important;
      }

      .clear-search-btn {
        position: absolute;
        right: 0.75rem;
        background: none;
        border: none;
        color: var(--text-muted);
        font-size: 1.25rem;
        cursor: pointer;
        padding: 0.25rem 0.5rem;
        border-radius: 50%;
        display: none;
        line-height: 1;
        transition: color 0.15s, background-color 0.15s;
      }

      .clear-search-btn:hover {
        color: var(--text-main);
        background-color: var(--border-color);
      }

      .clear-search-btn.visible {
        display: block;
      }

      .stats-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
        padding: 0 0.5rem;
        color: var(--text-muted);
        font-size: 0.9rem;
      }

      .icon-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 1.25rem;
      }

      .icon-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        padding: 1.25rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: var(--shadow);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        position: relative;
      }

      .icon-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
      }

      .icon-preview {
        width: 64px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1rem;
        color: var(--text-main);
      }

      .icon-preview svg {
        width: 48px;
        height: 48px;
      }

      .icon-name {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-main);
        text-align: center;
        word-break: break-word;
        margin-bottom: 0.5rem;
      }

      .ligature-tag {
        font-size: 0.75rem;
        color: var(--text-muted);
        background: var(--bg-color);
        padding: 0.25rem 0.5rem;
        border-radius: 4px;
        text-align: center;
        word-break: break-word;
        margin-bottom: 1rem;
        border: 1px solid var(--border-color);
        width: 100%;
      }

      .copy-btn {
        width: 100%;
        padding: 0.5rem;
        background-color: var(--bg-color);
        color: var(--text-main);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
      }

      .copy-btn:hover {
        background-color: var(--primary);
        color: white;
        border-color: var(--primary);
      }

      .copy-btn.copied {
        background-color: #10b981;
        color: white;
        border-color: #10b981;
      }

      .empty-state {
        grid-column: 1 / -1;
        text-align: center;
        padding: 4rem 2rem;
        background: var(--card-bg);
        border-radius: var(--radius);
        border: 1px dashed var(--border-color);
        color: var(--text-muted);
      }

      .toast {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        background: #0f172a;
        color: white;
        padding: 0.75rem 1.5rem;
        border-radius: 8px;
        font-size: 0.9rem;
        font-weight: 500;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s, transform 0.2s;
        pointer-events: none;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      }

      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
  </head>
  <body>

    <div class="container">
      <header>
        <div class="header-top">
          <h1>SCION Icon Explorer</h1>
        </div>

        <div class="json-url-display" id="jsonUrlDisplay">
          Source: <a id="headerUrlLink" href="#" target="_blank" rel="noopener">Loading...</a>
        </div>

        <!-- Collapsible Section (Collapsed by default) -->
        <details class="file-settings">
          <summary>⚙️ Change Definition File Source</summary>
          <div class="controls-grid">
            <div class="input-group">
              <label for="urlInput">Definition File Location (JSON)</label>
              <div class="url-input-wrapper">
                <input type="text" id="urlInput" value="https://cdn.jsdelivr.net/npm/@scion/icons/scion-icons.json" placeholder="Enter path or URL to icon JSON file...">
                <button class="btn" id="loadUrlBtn">Load</button>
              </div>
            </div>

            <div class="input-group">
              <label>Or Load Local File</label>
              <label class="file-label" id="dropZone">
                📁 Choose local file or drop JSON here
                <input type="file" id="fileInput" accept=".json">
              </label>
            </div>
          </div>
        </details>
      </header>

      <!-- Full-Width Search Bar Section -->
      <div class="search-section">
        <div class="input-group">
          <label for="searchInput">Filter / Search Icons</label>
          <div class="search-wrapper">
            <input type="text" id="searchInput" class="search-input" placeholder="Search by icon name or ligature (e.g., bin, edit, chevron)...">
            <button class="clear-search-btn" id="clearSearchBtn" title="Clear search">✕</button>
          </div>
        </div>
      </div>

      <div class="stats-bar">
        <span id="setInfo">Loading default icon set...</span>
        <span id="countInfo">0 icons</span>
      </div>

      <div class="icon-grid" id="iconGrid">
        <div class="empty-state">
          <p>Loading default icon set...</p>
        </div>
      </div>
    </div>

    <div class="toast" id="toast">Copied to clipboard!</div>

    <script>
      let allIcons = [];
      const DEFAULT_JSON_PATH = 'https://cdn.jsdelivr.net/npm/@scion/icons/scion-icons.json';
      const LIGATURE_PREFIX = 'scion.';

      const urlInput = document.getElementById('urlInput');
      const loadUrlBtn = document.getElementById('loadUrlBtn');
      const fileInput = document.getElementById('fileInput');
      const dropZone = document.getElementById('dropZone');
      const searchInput = document.getElementById('searchInput');
      const clearSearchBtn = document.getElementById('clearSearchBtn');
      const iconGrid = document.getElementById('iconGrid');
      const setInfo = document.getElementById('setInfo');
      const countInfo = document.getElementById('countInfo');
      const toast = document.getElementById('toast');
      const headerUrlLink = document.getElementById('headerUrlLink');

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      }

      function updateHeaderUrlDisplay(url, isLocalFile = false) {
        if (isLocalFile) {
          headerUrlLink.textContent = `Local file: ${url}`;
          headerUrlLink.removeAttribute('href');
          headerUrlLink.style.cursor = 'default';
        }
        else {
          headerUrlLink.textContent = url;
          headerUrlLink.href = url;
          headerUrlLink.style.cursor = 'pointer';
        }
      }

      function formatLigatures(rawLigatures) {
        if (!rawLigatures) {
          return '';
        }
        return rawLigatures
        .split(',')
        .map(s => s.trim())
        .filter(Boolean)
        .map(s => s.startsWith(LIGATURE_PREFIX) ? s : LIGATURE_PREFIX + s)
        .join(', ');
      }

      function parseIcoMoonJSON(data) {
        allIcons = [];
        const iconSets = data.iconSets || [data];
        let setName = data.metadata?.name || 'Icon Set';

        iconSets.forEach(set => {
          if (set.metadata?.name) {
            setName = set.metadata.name;
          }

          const fontEmSize = set.preferences?.fontPref?.metrics?.emSize || set.height || 1024;

          const selectionMap = new Map();
          if (Array.isArray(set.selection)) {
            set.selection.forEach(sel => selectionMap.set(sel.id, sel));
          }

          if (Array.isArray(set.icons)) {
            set.icons.forEach(iconObj => {
              const sel = selectionMap.get(iconObj.id) || {};
              const name = sel.name || (iconObj.tags && iconObj.tags[0]) || iconObj.properties?.name || `icon-${iconObj.id}`;

              let rawLigatures = sel.ligatures || iconObj.properties?.ligatures;
              if (!rawLigatures && iconObj.tags) {
                rawLigatures = iconObj.tags.join(', ');
              }
              if (!rawLigatures) {
                rawLigatures = name;
              }

              const ligatures = formatLigatures(rawLigatures);

              const paths = iconObj.paths || [];
              const attrs = iconObj.attrs || [];

              allIcons.push({
                id: iconObj.id,
                name: name,
                ligatures: ligatures,
                paths: paths,
                attrs: attrs,
                grid: fontEmSize,
              });
            });
          }
        });

        setInfo.textContent = `Set: ${setName}`;
        renderGrid();
      }

      function renderGrid() {
        const query = searchInput.value.toLowerCase().trim();

        if (searchInput.value.length > 0) {
          clearSearchBtn.classList.add('visible');
        }
        else {
          clearSearchBtn.classList.remove('visible');
        }

        iconGrid.innerHTML = '';

        const filtered = allIcons.filter(icon => {
          return icon.name.toLowerCase().includes(query) ||
            icon.ligatures.toLowerCase().includes(query);
        });

        countInfo.textContent = `${filtered.length} of ${allIcons.length} icons`;

        if (filtered.length === 0) {
          iconGrid.innerHTML = `
          <div class="empty-state">
            <p>${allIcons.length === 0 ? 'No icon set loaded.' : 'No icons match your search criteria.'}</p>
          </div>`;
          return;
        }

        filtered.forEach(icon => {
          const card = document.createElement('div');
          card.className = 'icon-card';

          let pathsHtml = '';
          icon.paths.forEach((pathData, idx) => {
            const attr = icon.attrs[idx] || {};
            const opacity = attr.opacity !== undefined ? attr.opacity : 1;
            const fill = attr.fill || 'currentColor';

            pathsHtml += `<path d="${pathData}" fill="${fill}" opacity="${opacity}"></path>`;
          });

          const svgHtml = `
          <svg viewBox="0 0 ${icon.grid} ${icon.grid}" xmlns="http://www.w3.org/2000/svg">
            <g>
              ${pathsHtml}
            </g>
          </svg>`;

          card.innerHTML = `
          <div class="icon-preview">${svgHtml}</div>
          <div class="icon-name" title="${icon.name}">${icon.name}</div>
          <div class="ligature-tag" title="Ligatures: ${icon.ligatures}">${icon.ligatures}</div>
          <button class="copy-btn">Copy Ligature</button>
        `;

          const copyBtn = card.querySelector('.copy-btn');
          copyBtn.addEventListener('click', () => {
            const primaryLigature = icon.ligatures.split(',')[0].trim();
            navigator.clipboard.writeText(primaryLigature).then(() => {
              copyBtn.textContent = 'Copied!';
              copyBtn.classList.add('copied');
              showToast(`Copied "${primaryLigature}" to clipboard`);
              setTimeout(() => {
                copyBtn.textContent = 'Copy Ligature';
                copyBtn.classList.remove('copied');
              }, 1500);
            });
          });

          iconGrid.appendChild(card);
        });
      }

      function loadFile(file) {
        if (!file) {
          return;
        }
        updateHeaderUrlDisplay(file.name, true);
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const json = JSON.parse(e.target.result);
            parseIcoMoonJSON(json);
          }
          catch (err) {
            alert('Invalid JSON file format.');
          }
        };
        reader.readAsText(file);
      }

      function loadUrl(url) {
        if (!url) {
          return;
        }
        updateHeaderUrlDisplay(url);
        fetch(url)
        .then(res => {
          if (!res.ok) {
            throw new Error('Network response was not ok');
          }
          return res.json();
        })
        .then(data => parseIcoMoonJSON(data))
        .catch(err => {
          setInfo.textContent = 'Failed to load default JSON file';
          iconGrid.innerHTML = `
            <div class="empty-state">
              <p>Could not fetch JSON file from path: <strong>${url}</strong>.</p>
              <p style="margin-top: 0.5rem; font-size: 0.85rem;">Ensure the URL is correct and available.</p>
            </div>`;
        });
      }

      loadUrlBtn.addEventListener('click', () => loadUrl(urlInput.value.trim()));
      urlInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          loadUrl(urlInput.value.trim());
        }
      });

      fileInput.addEventListener('change', (e) => loadFile(e.target.files[0]));

      searchInput.addEventListener('input', renderGrid);

      clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        searchInput.focus();
        renderGrid();
      });

      dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = 'var(--primary)';
        dropZone.style.backgroundColor = 'var(--accent-bg)';
      });

      dropZone.addEventListener('dragleave', () => {
        dropZone.style.borderColor = 'var(--border-color)';
        dropZone.style.backgroundColor = 'var(--bg-color)';
      });

      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = 'var(--border-color)';
        dropZone.style.backgroundColor = 'var(--bg-color)';
        if (e.dataTransfer.files.length > 0) {
          loadFile(e.dataTransfer.files[0]);
        }
      });

      window.addEventListener('DOMContentLoaded', () => {
        loadUrl(DEFAULT_JSON_PATH);
      });
    </script>
  </body>
</html>
