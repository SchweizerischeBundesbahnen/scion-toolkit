<!-- Code generated by Gemini (AI Assistant) -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>SCION Icon Explorer</title>
    <style>
      :root {
        --bg-color: #f8fafc;
        --card-bg: #ffffff;
        --border-color: #e2e8f0;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --accent-bg: #eff6ff;
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        --radius: 12px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        padding: 2rem;
        min-height: 100vh;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
      }

      .search-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        width: 100%;
        margin-bottom: 1rem;
      }

      .search-icon {
        position: absolute;
        left: 1rem;
        display: flex;
        align-items: center;
        color: var(--text-muted);
        pointer-events: none;
      }

      .search-input {
        width: 100%;
        font-size: 1rem;
        padding: 0.85rem 2.75rem 0.85rem 2.75rem;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      .search-input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      }

      .clear-search-btn {
        position: absolute;
        right: 0.75rem;
        background: none;
        border: none;
        color: var(--text-muted);
        font-size: 1.25rem;
        cursor: pointer;
        padding: 0.25rem 0.5rem;
        border-radius: 50%;
        display: none;
        line-height: 1;
        transition: color 0.15s, background-color 0.15s;
      }

      .clear-search-btn:hover {
        color: var(--text-main);
        background-color: var(--border-color);
      }

      .clear-search-btn.visible {
        display: block;
      }

      .stats-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
        padding: 0 0.5rem;
        color: var(--text-muted);
        font-size: 0.85rem;
      }

      .source-separator {
        color: var(--border-color);
      }

      .source-link {
        color: var(--primary);
        text-decoration: none;
      }

      .source-link:hover {
        text-decoration: underline;
      }

      .icon-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 1.25rem;
      }

      .icon-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        padding: 1.25rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: var(--shadow);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        position: relative;
      }

      .icon-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
      }

      .icon-preview {
        width: 64px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1rem;
        color: var(--text-main);
      }

      .icon-preview svg {
        width: 48px;
        height: 48px;
      }

      .icon-name {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-main);
        text-align: center;
        word-break: break-word;
        margin-bottom: 0.5rem;
      }

      .ligature-tag {
        font-size: 0.75rem;
        color: var(--text-muted);
        background: var(--bg-color);
        padding: 0.25rem 0.5rem;
        border-radius: 4px;
        text-align: center;
        word-break: break-word;
        margin-bottom: 1rem;
        border: 1px solid var(--border-color);
        width: 100%;
      }

      .copy-btn {
        width: 100%;
        padding: 0.5rem;
        background-color: var(--bg-color);
        color: var(--text-main);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
      }

      .copy-btn:hover {
        background-color: var(--primary);
        color: white;
        border-color: var(--primary);
      }

      .copy-btn.copied {
        background-color: #10b981;
        color: white;
        border-color: #10b981;
      }

      .empty-state {
        grid-column: 1 / -1;
        text-align: center;
        padding: 4rem 2rem;
        background: var(--card-bg);
        border-radius: var(--radius);
        border: 1px dashed var(--border-color);
        color: var(--text-muted);
      }

      .toast {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        background: #0f172a;
        color: white;
        padding: 0.75rem 1.5rem;
        border-radius: 8px;
        font-size: 0.9rem;
        font-weight: 500;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.2s, transform 0.2s;
        pointer-events: none;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      }

      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
  </head>
  <body>

    <div class="container">
      <div class="search-wrapper">
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </span>
        <input type="text" id="searchInput" class="search-input" placeholder="Search SCION icons..." autofocus>
        <button class="clear-search-btn" id="clearSearchBtn" title="Clear search">✕</button>
      </div>

      <div class="stats-bar">
        <span id="countInfo">0 icons</span>
        <a class="source-link" href="https://cdn.jsdelivr.net/npm/@scion/icons/" target="_blank" rel="noopener">https://cdn.jsdelivr.net/npm/@scion/icons/</a>
      </div>

      <div class="icon-grid" id="iconGrid">
        <div class="empty-state">
          <p>Loading icons...</p>
        </div>
      </div>
    </div>

    <div class="toast" id="toast">Copied to clipboard!</div>

    <script>
      let allIcons = [];
      const JSON_URL = 'https://cdn.jsdelivr.net/npm/@scion/icons/scion-icons.json';
      const LIGATURE_PREFIX = 'scion:';

      const searchInput = document.getElementById('searchInput');
      const clearSearchBtn = document.getElementById('clearSearchBtn');
      const iconGrid = document.getElementById('iconGrid');
      const countInfo = document.getElementById('countInfo');
      const toast = document.getElementById('toast');

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      }

      function formatLigatures(rawLigatures) {
        if (!rawLigatures) {
          return '';
        }
        return rawLigatures
        .split(',')
        .map(s => s.trim())
        .filter(Boolean)
        .map(s => s.startsWith(LIGATURE_PREFIX) ? s : LIGATURE_PREFIX + s)
        .join(', ');
      }

      function parseIcoMoonJSON(data) {
        allIcons = [];
        const iconSets = data.iconSets || [data];

        iconSets.forEach(set => {
          const fontEmSize = set.preferences?.fontPref?.metrics?.emSize || set.height || 1024;

          const selectionMap = new Map();
          if (Array.isArray(set.selection)) {
            set.selection.forEach(sel => selectionMap.set(sel.id, sel));
          }

          if (Array.isArray(set.icons)) {
            set.icons.forEach(iconObj => {
              const sel = selectionMap.get(iconObj.id) || {};
              const name = sel.name || (iconObj.tags && iconObj.tags[0]) || iconObj.properties?.name || `icon-${iconObj.id}`;

              let rawLigatures = sel.ligatures || iconObj.properties?.ligatures;
              if (!rawLigatures && iconObj.tags) {
                rawLigatures = iconObj.tags.join(', ');
              }
              if (!rawLigatures) {
                rawLigatures = name;
              }

              const ligatures = formatLigatures(rawLigatures);
              const paths = iconObj.paths || [];
              const attrs = iconObj.attrs || [];

              allIcons.push({
                id: iconObj.id,
                name: name,
                ligatures: ligatures,
                paths: paths,
                attrs: attrs,
                grid: fontEmSize,
              });
            });
          }
        });

        renderGrid();
      }

      function renderGrid() {
        const query = searchInput.value.toLowerCase().trim();

        if (searchInput.value.length > 0) {
          clearSearchBtn.classList.add('visible');
        } else {
          clearSearchBtn.classList.remove('visible');
        }

        iconGrid.innerHTML = '';

        const filtered = allIcons.filter(icon => {
          return icon.name.toLowerCase().includes(query) ||
            icon.ligatures.toLowerCase().includes(query);
        });

        countInfo.textContent = `${filtered.length} of ${allIcons.length} icons`;

        if (filtered.length === 0) {
          iconGrid.innerHTML = `
            <div class="empty-state">
              <p>${allIcons.length === 0 ? 'No icons found.' : 'No icons match your search criteria.'}</p>
            </div>`;
          return;
        }

        filtered.forEach(icon => {
          const card = document.createElement('div');
          card.className = 'icon-card';

          let pathsHtml = '';
          icon.paths.forEach((pathData, idx) => {
            const attr = icon.attrs[idx] || {};
            const opacity = attr.opacity !== undefined ? attr.opacity : 1;
            const fill = attr.fill || 'currentColor';

            pathsHtml += `<path d="${pathData}" fill="${fill}" opacity="${opacity}"></path>`;
          });

          const svgHtml = `
            <svg viewBox="0 0 ${icon.grid} ${icon.grid}" xmlns="http://www.w3.org/2000/svg">
              <g>
                ${pathsHtml}
              </g>
            </svg>`;

          card.innerHTML = `
            <div class="icon-preview">${svgHtml}</div>
            <div class="icon-name" title="${icon.name}">${icon.name}</div>
            <div class="ligature-tag" title="Ligatures: ${icon.ligatures}">${icon.ligatures}</div>
            <button class="copy-btn">Copy Ligature</button>
          `;

          const copyBtn = card.querySelector('.copy-btn');
          copyBtn.addEventListener('click', () => {
            const primaryLigature = icon.ligatures.split(',')[0].trim();
            navigator.clipboard.writeText(primaryLigature).then(() => {
              copyBtn.textContent = 'Copied!';
              copyBtn.classList.add('copied');
              showToast(`Copied "${primaryLigature}" to clipboard`);
              setTimeout(() => {
                copyBtn.textContent = 'Copy Ligature';
                copyBtn.classList.remove('copied');
              }, 1500);
            });
          });

          iconGrid.appendChild(card);
        });
      }

      function loadIcons() {
        fetch(JSON_URL)
        .then(res => {
          if (!res.ok) {
            throw new Error('Network response was not ok');
          }
          return res.json();
        })
        .then(data => parseIcoMoonJSON(data))
        .catch(err => {
          countInfo.textContent = 'Failed to load icons';
          iconGrid.innerHTML = `
              <div class="empty-state">
                <p>Could not fetch icon definitions from <strong>${JSON_URL}</strong>.</p>
              </div>`;
        });
      }

      searchInput.addEventListener('input', renderGrid);

      clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        searchInput.focus();
        renderGrid();
      });

      window.addEventListener('DOMContentLoaded', loadIcons);
    </script>
  </body>
</html>
